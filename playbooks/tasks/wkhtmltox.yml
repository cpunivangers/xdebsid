---

- name: wkhtmltox | HREF
  shell: |
    # Dépot Github
    latest="https://github.com/wkhtmltopdf/packaging/releases/latest"
    VERSION=$(basename $(curl -sI "$latest" | grep -i "location" | dos2unix | cut -d" " -f2))
    nameExeGit=wkhtmltox_$VERSION.{{ ansible_facts["distribution_release"] }}_amd64.deb
    if ( curl -sI "$latest/download/$nameExeGit" | grep -qn -i "location" ) ; then
      nameExeGit=wkhtmltox_$VERSION.bookworm_amd64.deb
    fi
    echo "$latest/download/$nameExeGit"

  register: retour_href
  changed_when: false

- name: wkhtmltox | Version dispo {{ retour_href.stdout }}
  shell: basename '{{ retour_href.stdout }}' | cut -d_ -f2 | cut -d- -f1
  #~ args:
    #~ warn: false
  become_user: '{{ ansible_facts.env.SUDO_USER }}'
  register: retour_vers
  changed_when: false

- name : wkhtmltox | Version {{ retour_vers.stdout }}
  set_fact:
    pkg:
      name: wkhtmltox
      url: '{{ retour_href.stdout }}'
      vers: '{{ retour_vers.stdout }}'

- import_tasks: url_pkg.yml
